<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Taustan pehmeä syvyys -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A2332" />
      <stop offset="100%" stop-color="#0A0D14" />
    </radialGradient>

    <!-- Neon Cyan -> Lucid Purple liukuväri pääikoniin -->
    <linearGradient id="dreamGrad" x1="15%" y1="15%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="55%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#9B51E0" />
    </linearGradient>

    <!-- Sisempi aaltoliuku -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#9B51E0" stop-opacity="0.2" />
    </linearGradient>

    <!-- Hieno hehku (glow) -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Taustalaatikko (pyöristetty moderni squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#26354A" stroke-width="2" opacity="0.6" />

  <!-- Ikonigrafiikka -->
  <g transform="translate(256, 256)" filter="url(#neonGlow)">
    
    <!-- Ulompi kaari / Sirppikuu & Rumpukalvon kehä -->
    <path d="M 0,-150 
             A 150 150 0 1 1 -106,106
             A 125 125 0 1 0 0,-100
             Z" fill="url(#dreamGrad)" />

    <!-- Sisemmät rumpuaallot / pulssi (samalla unen aaltoliike) -->
    <!-- Rengas 1 (Uloin rumpuvärähdys) -->
    <path d="M -20,-75 
             A 80 80 0 1 1 -75,20" fill="none" stroke="url(#pulseGrad)" stroke-width="16" stroke-linecap="round" />

    <!-- Rengas 2 (Keskimmäinen iskuvoima) -->
    <path d="M -10,-40 
             A 42 42 0 1 1 -40,10" fill="none" stroke="#00F2FE" stroke-width="14" stroke-linecap="round" />

    <!-- Iskun ydin / Beat point -->
    <circle cx="12" cy="12" r="14" fill="#00F2FE" />
    
    <!-- Pieni unenomainen heijastuspiste kapulan iskusta -->
    <circle cx="55" cy="-55" r="7" fill="#FFFFFF" opacity="0.85" />
  </g>
</svg>