<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="60%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#9B51E0" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Pieni symboli vasemmalla -->
  <g transform="translate(100, 100) scale(0.48)" filter="url(#softGlow)">
    <path d="M 0,-150 A 150 150 0 1 1 -106,106 A 125 125 0 1 0 0,-100 Z" fill="url(#logoGrad)" />
    <path d="M -20,-75 A 80 80 0 1 1 -75,20" fill="none" stroke="url(#logoGrad)" stroke-width="16" stroke-linecap="round" />
    <circle cx="12" cy="12" r="14" fill="#00F2FE" />
    <circle cx="55" cy="-55" r="7" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Typografia -->
  <text x="210" y="118" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, &#39;Montserrat&#39;, sans-serif" font-size="58" font-weight="900" letter-spacing="4" fill="url(#logoGrad)">DREAM</text>
  <text x="445" y="118" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, &#39;Montserrat&#39;, sans-serif" font-size="58" font-weight="300" letter-spacing="8" fill="#E6EDF3">DRUMS</text>

  <!-- Pieni alateksti / slogan -->
  <text x="448" y="148" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="6" fill="#6E7681">SAMPLER ENGINE</text>
</svg>